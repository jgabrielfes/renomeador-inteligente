# Worker da JURIMETRIA REGISTRAL (Camada A — semente pública).
#
# O que faz: roda scripts/jurimetria/worker.ts — enfileira coletas das fontes
# ativas, baixa documentos públicos (Datajud, CGJ, sites de cartório), extrai
# as exigências (Gemini com fallback local) e alimenta a fila de revisão do
# /admin/jurimetria. Scraping RESPEITOSO por construção: robots.txt, 1 req/2s
# por host, parada automática em 403/429/captcha (fonte vira "bloqueada").
#
# Por que uma GitHub Action e não a Vercel: coleta e extração estouram o
# timeout de função no plano Hobby; aqui o job roda por minutos, versionado
# junto do código — o mesmo padrão da varredura do Radar. O conteúdo BRUTO
# dos documentos vive SÓ neste runner efêmero: o banco recebe hash, origem e
# o texto já ANONIMIZADO (LGPD por construção).
#
# ‼️ SEGREDOS NECESSÁRIOS (Settings → Secrets → Actions)
#   · DIRECT_URL       — conexão direta do Supabase (o mesmo da migração).
#   · GEMINI_API_KEY   — opcional; sem ela vale o extrator local e TODA
#                        exigência cai na fila de revisão (confiança 0.5).
#   · DATAJUD_API_KEY  — a chave PÚBLICA da API do CNJ (wiki do Datajud);
#                        sem ela a fonte Datajud é pulada.

name: Jurimetria — coleta da semente pública

on:
  schedule:
    # 06:00 UTC = 03:00 em Brasília (madrugada — fora do horário das fontes).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sonda:
        description: "Só sondar fontes (e-SAJ/Datajud) sem rodar o worker"
        type: boolean
        default: false

concurrency:
  group: jurimetria-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Sonda TEMPORÁRIA de fontes (roda só com o input "sonda"): confere, de
      # um ponto com internet aberta, o que o ambiente de desenvolvimento não
      # alcança — robots.txt e estrutura do GECON/CJPG/CPOPG do e-SAJ e o
      # TLS/DNS do Datajud. Nenhum dado é gravado; será removida na calibragem.
      - name: Sonda — e-SAJ e Datajud
        if: inputs.sonda
        env:
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}
        run: |
          UA="LexCausaJurimetriaBot/1.0 (+https://osucessorista.vercel.app/portal/privacidade; contato tecnico)"
          CHAVE="$(printf '%s' "$DATAJUD_API_KEY" | tr -d '[:space:]')"
          echo "===== CJPG A: URL exata do coletor (termo + dtInicio + DESC) ====="
          curl -sS --max-time 60 -L "https://esaj.tjsp.jus.br/cjpg/pesquisar.do?dadosConsulta.pesquisaLivre=%22duvida%22%20registro%20de%20imoveis&dadosConsulta.dtInicio=30%2F08%2F2025&dadosConsulta.ordenacao=DESC" \
            -H "User-Agent: $UA" -o a.html -w "HTTP %{http_code} · %{size_download} bytes\n" || true
          echo "linhas: $(grep -c 'fundocinza1' a.html || true)"
          grep -oiE 'contendo|Não foi encontrado|nenhum r' a.html | sort | uniq -c | head -5 || true
          sleep 2
          echo "===== CJPG B: só o termo (controle) ====="
          curl -sS --max-time 60 -L "https://esaj.tjsp.jus.br/cjpg/pesquisar.do?dadosConsulta.pesquisaLivre=%22duvida%22%20registro%20de%20imoveis" \
            -H "User-Agent: $UA" -o b.html -w "HTTP %{http_code} · %{size_download} bytes\n" || true
          echo "linhas: $(grep -c 'fundocinza1' b.html || true)"
          echo "--- datas de disponibilização da página 1 (controle):"
          grep -oE 'Disponibiliza[^<]*' -A 0 b.html | head -3 || true
          grep -A 2 -i "Data de Disponibiliza" b.html | grep -oE '[0-9]{2}/[0-9]{2}/[0-9]{4}' | head -10 || true
          sleep 2
          echo "===== CJPG C: termo + só ordenacao DESC (isola o dtInicio) ====="
          curl -sS --max-time 60 -L "https://esaj.tjsp.jus.br/cjpg/pesquisar.do?dadosConsulta.pesquisaLivre=%22duvida%22%20registro%20de%20imoveis&dadosConsulta.ordenacao=DESC" \
            -H "User-Agent: $UA" -o c.html -w "HTTP %{http_code} · %{size_download} bytes\n" || true
          echo "linhas: $(grep -c 'fundocinza1' c.html || true)"
          echo "===== Datajud 1: match_all (a chave enxerga o índice?) ====="
          curl -sS --max-time 30 -X POST "https://api-publica.datajud.cnj.jus.br/api_publica_tjsp/_search" \
            -H "content-type: application/json" -H "authorization: APIKey $CHAVE" \
            -d '{"size":0,"query":{"match_all":{}}}' | head -c 400; echo
          echo "===== Datajud 2: só classe Dúvida ====="
          curl -sS --max-time 30 -X POST "https://api-publica.datajud.cnj.jus.br/api_publica_tjsp/_search" \
            -H "content-type: application/json" -H "authorization: APIKey $CHAVE" \
            -d '{"size":1,"query":{"match_phrase":{"classe.nome":"Dúvida"}},"sort":[{"dataAjuizamento":"desc"}]}' | head -c 700; echo
          echo "===== Datajud 3: classe + órgão VRP (sem data) ====="
          curl -sS --max-time 30 -X POST "https://api-publica.datajud.cnj.jus.br/api_publica_tjsp/_search" \
            -H "content-type: application/json" -H "authorization: APIKey $CHAVE" \
            -d '{"size":1,"query":{"bool":{"must":[{"match_phrase":{"classe.nome":"Dúvida"}},{"match_phrase":{"orgaoJulgador.nome":"Vara de Registros Públicos"}}]}}}' | head -c 700; echo

      - uses: actions/checkout@v4
        if: ${{ !inputs.sonda }}

      - uses: actions/setup-node@v4
        if: ${{ !inputs.sonda }}
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependências
        if: ${{ !inputs.sonda }}
        run: yarn install --frozen-lockfile

      - name: Gerar o client do Prisma
        if: ${{ !inputs.sonda }}
        run: npx prisma generate

      - name: Rodar o worker
        if: ${{ !inputs.sonda }}
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}
        run: npx tsx scripts/jurimetria/worker.ts | tee resumo.txt

      - name: Resumo
        if: ${{ always() && !inputs.sonda }}
        run: |
          echo "### Jurimetria — coleta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 resumo.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
