# Deploy de PRODUÇÃO da plataforma — os TRÊS sites publicados deste repositório.
#
# Por que existe: no plano Hobby da Vercel, o deploy de produção fica
# "Blocked" quando o autor do commit no Git não é o dono da conta — foi o que
# passou a acontecer com as contribuições de outras pessoas na `main`.
# Aqui o deploy é criado pela CLI oficial da Vercel autenticada com o TOKEN DO
# DONO da conta, então a Vercel o atribui a ele e não bloqueia, seja de quem
# for o commit que entrou na `main`.
#
# São três projetos na Vercel apontando para o MESMO repositório; o que os
# diferencia é a variável de ambiente APP (ver lib/app.ts), configurada no
# painel de cada projeto:
#   renomeador   -> APP=renomeador   -> renomeador-inteligente.vercel.app
#   sucessorista -> APP=sucessorista -> osucessorista.vercel.app
#   notas        -> APP=notas        -> resolvedor de notas devolutivas
# O `vercel pull` traz as envs do projeto, então cada job compila com o APP
# certo sem que este arquivo precise saber qual é qual.
#
# O auto-deploy da `main` fica DESLIGADO em `vercel.json`
# (git.deploymentEnabled.main = false) para não haver deploy duplicado; as
# demais branches seguem publicando preview automaticamente, como antes.
#
# Segredos necessários em Settings → Secrets and variables → Actions
# (os ids saem de `.vercel/project.json`, gerado por `vercel link` em cada
# projeto):
#   VERCEL_TOKEN                    — Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID                   — campo `orgId` (o mesmo nos dois)
#   VERCEL_PROJECT_ID_RENOMEADOR    — `projectId` do projeto do Renomeador
#   VERCEL_PROJECT_ID_SUCESSORISTA  — `projectId` do projeto do Sucessorista
#   VERCEL_PROJECT_ID_NOTAS         — `projectId` do projeto do Resolvedor de Notas
#
# O token precisa ter escopo de CONTA ("Full Account"): com escopo de projeto
# a CLI não passa do primeiro comando, porque ela lê recursos de usuário e de
# time para resolver o projeto.

name: Deploy de produção

on:
  push:
    branches: [main]
  # Permite republicar a produção pelo botão "Run workflow", sem commit novo.
  workflow_dispatch: {}

# Um deploy de produção por vez; não cancela o que já está no ar publicando.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      # Um site quebrado não impede a publicação do outro.
      fail-fast: false
      matrix:
        include:
          - site: renomeador
            project_id_secret: VERCEL_PROJECT_ID_RENOMEADOR
          - site: sucessorista
            project_id_secret: VERCEL_PROJECT_ID_SUCESSORISTA
          - site: notas
            project_id_secret: VERCEL_PROJECT_ID_NOTAS
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Vincular o projeto
        # O vínculo é escrito à mão (em vez de depender das variáveis de
        # ambiente): é o formato que a CLI espera, e o `tr -d` remove espaço
        # ou aspas que passam despercebidos ao colar o valor no secret.
        run: |
          mkdir -p .vercel
          org=$(printf '%s' "${{ secrets.VERCEL_ORG_ID }}" | tr -d '[:space:]"')
          proj=$(printf '%s' "${{ secrets[matrix.project_id_secret] }}" | tr -d '[:space:]"')
          if [ -z "$proj" ]; then
            echo "::error::Secret ${{ matrix.project_id_secret }} não configurado."
            exit 1
          fi
          printf '{"orgId":"%s","projectId":"%s"}' "$org" "$proj" > .vercel/project.json

      - name: Puxar as variáveis de ambiente de produção
        # Traz as envs do projeto (APP, GEMINI_API_KEY, DATABASE_URL, AUTH_*…)
        # — elas continuam vivendo só na Vercel, nunca no repositório. É daqui
        # que vem o APP que decide qual dos dois sites este job compila.
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Compilar
        # O build roda AQUI: se quebrar, nada vai para produção.
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Produção publicada — ${{ matrix.site }}" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
